name: build java_corretto_alpine_source
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 1,15 * *"
permissions:
  actions: read
  packages: write
concurrency:
  group: java-corretto-alpine-source-${{ github.ref }}-1
  cancel-in-progress: true
jobs:
  build_and_push:
    name: "java_${{ matrix.tag }}_corretto_alpine_source"
    runs-on: [self-hosted, Linux, X64]
    env:
      DOCKER_CLIENT_TIMEOUT: 120
      COMPOSE_HTTP_TIMEOUT: 120
    strategy:
      fail-fast: false
      matrix:
        tag:
          - 17
          - 21
          - 25
    steps:
      - name: Git checkout for repository workspace
        uses: actions/checkout@v4
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./java-corretto-alpine-source
          file: ./java-corretto-alpine-source/${{ matrix.tag }}/Dockerfile
          push: true
          tags: ghcr.io/ashlynorsomethin/pelican-images:java_${{ matrix.tag }}_corretto_alpine_source
