name: build java_gentoo variants

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 1,15 * *"

permissions:
  actions: read
  packages: write

concurrency:
  group: java-gentoo-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  build_and_push:
    name: "java_gentoo_${{ matrix.variant }}"
    runs-on: [self-hosted, Linux, X64]
    env:
      DOCKER_CLIENT_TIMEOUT: 120
      COMPOSE_HTTP_TIMEOUT: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: corretto
            upstream_image: amazoncorretto:21
            image_tag: java_gentoo_corretto
            requires_oracle_auth: false
          - variant: zulu
            upstream_image: azul/zulu-openjdk:21
            image_tag: java_gentoo_zulu
            requires_oracle_auth: false
          - variant: openjdk
            upstream_image: openjdk:21-jdk-slim
            image_tag: java_gentoo_openjdk
            requires_oracle_auth: false
          - variant: openjre
            upstream_image: eclipse-temurin:21-jre
            image_tag: java_gentoo_openjre
            requires_oracle_auth: false
          - variant: openjfx
            upstream_image: bellsoft/liberica-openjfx-debian:21
            image_tag: java_gentoo_openjfx
            requires_oracle_auth: false
          - variant: temurin
            upstream_image: eclipse-temurin:21-jdk
            image_tag: java_gentoo_temurin
            requires_oracle_auth: false
          - variant: openj9
            upstream_image: ibm-semeru-runtimes:open-21-jdk
            image_tag: java_gentoo_openj9
            requires_oracle_auth: false
          - variant: ibm-j9
            upstream_image: ibm-semeru-runtimes:open-21-jdk
            image_tag: java_gentoo_ibm_j9
            requires_oracle_auth: false
          - variant: ibm-certified
            upstream_image: ibm-semeru-runtimes:ibm-21-jdk
            image_tag: java_gentoo_ibm_certified
            requires_oracle_auth: false
          - variant: liberica
            upstream_image: bellsoft/liberica-openjdk-debian:21
            image_tag: java_gentoo_liberica
            requires_oracle_auth: false
          - variant: microsoft-openjdk
            upstream_image: mcr.microsoft.com/openjdk/jdk:21-ubuntu
            image_tag: java_gentoo_microsoft_openjdk
            requires_oracle_auth: false

    steps:
      - name: Git checkout for repository workspace
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./java-gentoo
          file: ./java-gentoo/Dockerfile
          build-args: |
            UPSTREAM_IMAGE=${{ matrix.upstream_image }}
          push: true
          tags: ghcr.io/ashlynorsomethin/pelican-images:${{ matrix.image_tag }}