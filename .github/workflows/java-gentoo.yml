name: build java_gentoo variants

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 1,15 * *"

permissions:
  actions: read
  packages: write

concurrency:
  group: java-gentoo-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  build_and_push:
    name: "java_gentoo_${{ matrix.variant }}"
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    env:
      DOCKER_CLIENT_TIMEOUT: 120
      COMPOSE_HTTP_TIMEOUT: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: corretto
            upstream_image: amazoncorretto:25-alpine
            image_tag: java_gentoo_corretto
            requires_oracle_auth: false
          - variant: zulu
            upstream_image: azul/zulu-openjdk-alpine:25-jre-headless
            image_tag: java_gentoo_zulu
            requires_oracle_auth: false

    steps:
      - name: Git checkout for repository workspace
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./java-gentoo
          file: ./java-gentoo/Dockerfile
          build-args: |
            UPSTREAM_IMAGE=${{ matrix.upstream_image }}
          push: true
          tags: ghcr.io/ashlynorsomethin/pelican-images:${{ matrix.image_tag }}