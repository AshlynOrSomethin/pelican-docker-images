name: run all workflows

on:
  workflow_dispatch:
  push:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Dispatch all other workflows
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.ref.replace(/^refs\/(heads|tags)\//, "");

            const currentWorkflowRef = process.env.GITHUB_WORKFLOW_REF || "";
            const currentWorkflowPath = currentWorkflowRef
              .split("@")[0]
              .split(`${owner}/${repo}/`)[1];

            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner,
              repo,
              per_page: 100,
            });

            const targets = workflows.filter((workflow) => {
              if (workflow.state !== "active") return false;
              if (!workflow.path?.startsWith(".github/workflows/")) return false;
              return workflow.path !== currentWorkflowPath;
            });

            core.info(`Dispatching ${targets.length} workflows on ref '${ref}'`);

            for (const workflow of targets) {
              core.info(`Dispatching ${workflow.path}`);
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflow.id,
                ref,
              });
            }

            core.info("All workflow dispatch calls submitted.");